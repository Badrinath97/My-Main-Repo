<template>
  <template lwc:if={hasStats}>
    <div class="tiles">
      <template for:each={tiles} for:item="tile">
        <button
          key={tile.key}
          class={tile.className}
          data-status={tile.status}
          aria-pressed={tile.pressed}
          onclick={handleTileClick}
        >
          <span class="value">{tile.value}</span>
          <span class="label"><span class="dot"></span>{tile.label}</span>
        </button>
      </template>
      <button
        class={favoritesClass}
        data-id="favorites"
        aria-pressed={favoritesPressed}
        title="Show favorites only"
        onclick={handleFavoritesClick}
      >
        <span class="value">{stats.favorites}</span>
        <span class="label">&#9829; Favorites</span>
      </button>
      <div class="tile glass tile_static tile_rating">
        <span class="value">{averageRating}</span>
        <span class="label">&#9733; Avg rating</span>
      </div>
    </div>
    <div class="types">
      <template for:each={typeBreakdown} for:item="type">
        <span key={type.key} class="type-chip glass">{type.label}</span>
      </template>
    </div>
  </template>
</template>

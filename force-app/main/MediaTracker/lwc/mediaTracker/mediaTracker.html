<template>
  <lightning-card title={cardTitle} icon-name="standard:video">
    <template lwc:if={showAddButton}>
      <lightning-button
        slot="actions"
        variant="brand"
        label="Add"
        icon-name="utility:add"
        onclick={handleAdd}
      ></lightning-button>
    </template>

    <div class="slds-p-horizontal_medium">
      <template lwc:if={showStats}>
        <c-media-stats
          stats={stats}
          active-status={filter.status}
          onstatusselect={handleStatusSelect}
        ></c-media-stats>
      </template>

      <c-media-filter-bar
        type-options={typeOptions}
        status-options={statusOptions}
        sort-options={sortOptions}
        language-options={languageOptions}
        collection-options={collectionFilterOptions}
        filter={filter}
        view={view}
        onfilterchange={handleFilterChange}
        onviewchange={handleViewChange}
      ></c-media-filter-bar>

      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
        >
          {error}
        </div>
      </template>

      <template lwc:if={isCollectionsView}>
        <c-media-collection-list
          collections={collections}
          type-options={collectionTypeOptions}
          active-collection-id={filter.collectionId}
          onselect={handleCollectionSelect}
          onnew={handleNewCollection}
          onedit={handleEditCollection}
          ondelete={handleDeleteCollection}
        ></c-media-collection-list>
      </template>
      <template lwc:else>
        <div class="slds-is-relative content">
          <template lwc:if={showSpinner}>
            <lightning-spinner
              size="small"
              alternative-text="Loading"
            ></lightning-spinner>
          </template>

          <template lwc:if={hasItems}>
            <div class={listClass}>
              <template for:each={cards} for:item="card">
                <c-media-card
                  key={card.key}
                  item={card.item}
                  type-config={card.config}
                  variant={cardVariant}
                  onopen={handleOpen}
                  onedit={handleEdit}
                  ondelete={handleDelete}
                  onfavorite={handleFavorite}
                  onprogress={handleProgress}
                  oncollectionselect={handleCollectionSelect}
                ></c-media-card>
              </template>
            </div>

            <template lwc:if={hasMore}>
              <!-- Loads the next page when scrolled into view (infinite scroll). -->
              <div class="scroll-sentinel" data-id="scroll-sentinel"></div>
              <div class="slds-align_absolute-center slds-m-top_medium more">
                <template lwc:if={isAppending}>
                  <div class="more_loading" role="status">
                    <lightning-spinner
                      size="x-small"
                      variant="brand"
                      alternative-text="Loading more"
                    ></lightning-spinner>
                  </div>
                </template>
                <template lwc:elseif={showLoadMoreButton}>
                  <lightning-button
                    data-id="load-more"
                    label="Load more"
                    onclick={handleLoadMore}
                    disabled={isLoading}
                  ></lightning-button>
                </template>
              </div>
            </template>
          </template>
          <template lwc:elseif={showEmptyState}>
            <div class="empty slds-text-align_center slds-text-color_weak">
              <lightning-icon
                icon-name="utility:video"
                size="large"
                class="slds-m-bottom_small"
              ></lightning-icon>
              <p>{emptyMessage}</p>
            </div>
          </template>
        </div>
      </template>
    </div>

    <template lwc:if={showFooter}>
      <p slot="footer" class="slds-text-body_small slds-text-color_weak">
        {footerText}
      </p>
    </template>
  </lightning-card>
</template>

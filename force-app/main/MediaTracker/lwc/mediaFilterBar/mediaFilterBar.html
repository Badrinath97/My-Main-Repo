<template>
  <div class="bar glass">
    <lightning-input
      class="search"
      type="search"
      label="Search"
      variant="label-hidden"
      placeholder="Search title, genre or platform..."
      value={filter.searchTerm}
      onchange={handleSearch}
    ></lightning-input>

    <template lwc:if={showTypeFilter}>
      <lightning-combobox
        class="combo"
        label="Media type"
        data-id="type"
        variant="label-hidden"
        options={typeComboOptions}
        value={typeValue}
        onchange={handleType}
      ></lightning-combobox>
    </template>

    <lightning-combobox
      class="combo"
      label="Status"
      data-id="status"
      variant="label-hidden"
      options={statusComboOptions}
      value={statusValue}
      onchange={handleStatus}
    ></lightning-combobox>

    <template lwc:if={showLanguageFilter}>
      <lightning-combobox
        class="combo"
        label="Language"
        data-id="language"
        variant="label-hidden"
        options={languageComboOptions}
        value={languageValue}
        onchange={handleLanguage}
      ></lightning-combobox>
    </template>

    <template lwc:if={showCollectionFilter}>
      <lightning-combobox
        class="combo combo_wide"
        label="Collection"
        data-id="collection"
        variant="label-hidden"
        options={collectionComboOptions}
        value={collectionValue}
        onchange={handleCollection}
      ></lightning-combobox>
    </template>

    <div class="sort">
      <lightning-combobox
        class="combo"
        label="Sort by"
        data-id="sort"
        variant="label-hidden"
        options={sortOptions}
        value={filter.sortBy}
        onchange={handleSort}
      ></lightning-combobox>
      <button
        class="gloss"
        data-id="direction"
        title={directionLabel}
        aria-label={directionLabel}
        onclick={toggleDirection}
      >
        <lightning-icon
          icon-name={directionIcon}
          size="x-small"
        ></lightning-icon>
      </button>
    </div>

    <div class="actions">
      <button
        class={favoritesClass}
        data-id="favorites"
        aria-pressed={favoritesPressed}
        aria-label="Show favorites only"
        title="Favorites only"
        onclick={toggleFavorites}
      >
        &#9829;
      </button>
      <div class="views" role="group" aria-label="View">
        <button
          class={gridClass}
          title="Grid view"
          aria-label="Grid view"
          aria-pressed={gridPressed}
          onclick={showGrid}
        >
          <lightning-icon
            icon-name="utility:tile_card_list"
            size="x-small"
          ></lightning-icon>
        </button>
        <button
          class={listClass}
          title="List view"
          aria-label="List view"
          aria-pressed={listPressed}
          onclick={showList}
        >
          <lightning-icon
            icon-name="utility:list"
            size="x-small"
          ></lightning-icon>
        </button>
        <button
          class={collectionsClass}
          title="Collections"
          aria-label="Collections"
          aria-pressed={collectionsPressed}
          onclick={showCollections}
        >
          <lightning-icon
            icon-name="utility:layers"
            size="x-small"
          ></lightning-icon>
        </button>
      </div>
    </div>
  </div>
</template>

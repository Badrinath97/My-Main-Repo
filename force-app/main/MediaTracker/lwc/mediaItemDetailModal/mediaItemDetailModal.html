<template>
  <lightning-modal-body>
    <c-media-item-detail
      item={item}
      type-config={typeConfig}
    ></c-media-item-detail>
  </lightning-modal-body>

  <lightning-modal-footer>
    <div class="footer">
      <div class="footer-group">
        <button class="gloss gbtn" data-id="record" onclick={handleRecord}>
          <lightning-icon
            icon-name="utility:new_window"
            size="x-small"
          ></lightning-icon>
          Open record page
        </button>
        <button
          class="gloss gbtn gloss_danger"
          data-id="delete"
          onclick={handleDelete}
        >
          <lightning-icon
            icon-name="utility:delete"
            size="x-small"
          ></lightning-icon>
          Delete
        </button>
      </div>
      <div class="footer-group">
        <button class="gloss gbtn" data-id="close" onclick={handleClose}>
          Close
        </button>
        <button
          class="gloss gbtn gloss_primary"
          data-id="edit"
          onclick={handleEdit}
        >
          <lightning-icon
            icon-name="utility:edit"
            size="x-small"
          ></lightning-icon>
          Edit
        </button>
      </div>
    </div>
  </lightning-modal-footer>
</template>

<template>
  <article class={containerClass}>
    <div
      class="media"
      role="button"
      tabindex="0"
      aria-label={openLabel}
      title={openLabel}
      onclick={handleOpen}
      onkeydown={handlePosterKeydown}
    >
      <template lwc:if={showPoster}>
        <img
          class="poster"
          src={item.posterUrl}
          alt={item.title}
          loading="lazy"
          onerror={handlePosterError}
        />
      </template>
      <template lwc:else>
        <div class={placeholderClass}>
          <lightning-icon
            icon-name={iconName}
            size="large"
            variant="inverse"
            alternative-text={typeLabel}
          ></lightning-icon>
        </div>
      </template>

      <template lwc:if={isGrid}>
        <div class="shade"></div>
        <span class="chip chip_type">{typeLabel}</span>
        <div class="overlay">
          <span class={statusClass}>{item.status}</span>
          <template lwc:if={hasRating}>
            <span class="chip rating" title="Your rating"
              >&#9733; {ratingLabel}</span
            >
          </template>
        </div>
      </template>
    </div>

    <div class="body">
      <div class="header">
        <h3 class="heading">
          <button
            class="title slds-truncate"
            title={item.title}
            onclick={handleOpen}
          >
            {item.title}
          </button>
        </h3>
        <lightning-button-icon-stateful
          icon-name="utility:favorite"
          selected={item.isFavorite}
          size="small"
          alternative-text="Toggle favorite"
          onclick={handleFavorite}
        ></lightning-button-icon-stateful>
        <lightning-button-menu
          icon-size="small"
          menu-alignment="right"
          alternative-text="More actions"
          onselect={handleMenuSelect}
        >
          <lightning-menu-item
            value="open"
            label="View details"
            prefix-icon-name="utility:preview"
          ></lightning-menu-item>
          <lightning-menu-item
            value="edit"
            label="Edit"
            prefix-icon-name="utility:edit"
          ></lightning-menu-item>
          <lightning-menu-item
            value="delete"
            label="Delete"
            prefix-icon-name="utility:delete"
          ></lightning-menu-item>
        </lightning-button-menu>
      </div>

      <template lwc:if={subtitle}>
        <p class="subtitle slds-truncate" title={subtitle}>{subtitle}</p>
      </template>

      <template lwc:if={hasCollection}>
        <button
          class="slds-button collection slds-truncate"
          title={collectionTitle}
          onclick={handleCollection}
        >
          <lightning-icon
            icon-name="utility:layers"
            size="xx-small"
            class="slds-m-right_xx-small"
          ></lightning-icon>
          {collectionLabel}
        </button>
      </template>

      <!-- In the list view the poster is small, so these sit in the body. -->
      <template lwc:if={isList}>
        <div class="badges">
          <span class="chip chip_outline">{typeLabel}</span>
          <span class={statusClass}>{item.status}</span>
          <template lwc:if={hasRating}>
            <span class="star-rating rating" title="Your rating"
              >&#9733; {ratingLabel}</span
            >
          </template>
        </div>
      </template>

      <template lwc:if={hasMovies}>
        <p class="movies" title={movieTitles}>
          <lightning-icon
            icon-name="utility:video"
            size="xx-small"
            class="slds-m-right_xx-small"
          ></lightning-icon>
          {movieLabel}
        </p>
      </template>

      <template lwc:if={tracksProgress}>
        <div class="progress">
          <template lwc:if={hasSeasons}>
            <p class="season">{seasonLabel}</p>
          </template>
          <div
            class="track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow={progressValue}
          >
            <div class={progressFillClass} style={progressFillStyle}></div>
          </div>
          <div class="progress-row">
            <span class="progress-label">{progressLabel}</span>
            <div class="steppers">
              <lightning-button-icon
                icon-name="utility:dash"
                variant="border-filled"
                size="x-small"
                alternative-text="Decrease progress"
                disabled={decrementDisabled}
                onclick={handleDecrement}
              ></lightning-button-icon>
              <lightning-button-icon
                icon-name="utility:add"
                variant="border-filled"
                size="x-small"
                alternative-text="Increase progress"
                disabled={incrementDisabled}
                onclick={handleIncrement}
              ></lightning-button-icon>
            </div>
          </div>
        </div>
      </template>
    </div>
  </article>
</template>
